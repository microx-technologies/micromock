name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: build / test / release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Restore Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.0-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.4.0-

      - name: Verify version tag
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          pkg_version="$(bun -p "require('./package.json').version")"
          if [ "$pkg_version" != "$version" ]; then
            echo "::error::Tag '$tag' does not match package.json version '$pkg_version'."
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Push compiled release branch
        run: |
          VERSION="${{ github.ref_name }}"
          TMP_COMPILED=$(mktemp -d)
          cp -r dist "$TMP_COMPILED/dist"
          cp package.json README.md LICENSE Dockerfile.tmpl "$TMP_COMPILED/"

          cd "$TMP_COMPILED"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${VERSION}"
          git add -A
          git commit -m "release: ${VERSION} compiled distribution"

          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push -f origin "${VERSION}"

          if [[ "${VERSION}" != *-* ]]; then
            git checkout -B latest
            git push -f origin latest
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
